name: Baixar arquivos do Framer
on:
  push:
    branches: [previa/framer-assets]
    paths: [.github/framer-urls.txt, .github/workflows/framer-assets.yml]
permissions:
  contents: write
jobs:
  baixar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq webp
      - name: Baixar
        run: |
          mkdir -p assets/fonts assets/img/framer
          while read -r u; do
            [ -z "$u" ] && continue
            id=$(basename "${u%%\?*}"); id=${id%.*}
            if [[ "$u" == *.woff2 ]]; then curl -fsSL "$u" -o "assets/fonts/$id.woff2"; continue; fi
            curl -fsSL "$u" -o /tmp/$id.png
            cwebp -quiet -q 86 /tmp/$id.png -o /tmp/$id.webp
            if [ $(stat -c%s /tmp/$id.webp) -lt $(stat -c%s /tmp/$id.png) ]; then cp /tmp/$id.webp assets/img/framer/; else cp /tmp/$id.png assets/img/framer/; fi
          done < .github/framer-urls.txt
          ls -la assets/fonts assets/img/framer
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add assets/fonts assets/img/framer
          git commit -m "Arquivos do Framer salvos no site" && git push
